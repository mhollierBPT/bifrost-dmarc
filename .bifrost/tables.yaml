_anchors:
  policies:
    - &admin_bypass
      name: admin_bypass
      description: Platform administrators may manage Bifrost DMARC data.
      actions: [read, create, update, delete]
      when: {user: is_platform_admin}
    - &dmarc_users_read
      name: dmarc_users_read
      description: DMARC Users may read DMARC data through the app.
      actions: [read]
      when: {call: has_role, args: [DMARC Users]}
    - &dmarc_users_write
      name: dmarc_users_write
      description: DMARC Users may maintain DMARC data.
      actions: [create, update, delete]
      when: {call: has_role, args: [DMARC Users]}

